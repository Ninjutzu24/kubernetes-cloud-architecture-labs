apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-inspector
  labels:
    app: whoami-inspector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami-inspector
  template:
    metadata:
      labels:
        app: whoami-inspector
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.10
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-inspector-svc
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
  selector:
    app: whoami-inspector