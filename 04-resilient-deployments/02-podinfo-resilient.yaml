apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-resilient
  labels:
    app: podinfo-resilient
spec:
  replicas: 4
  selector:
    matchLabels:
      app: podinfo-resilient
  template:
    metadata:
      labels:
        app: podinfo-resilient
    spec:
      containers:
        - name: podinfo
          image: stefanprodan/podinfo:6.4.0
          ports:
            - containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-resilient-svc
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9898
  selector:
    app: podinfo-resilient