apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-resilient
  labels:
    app: nginx-resilient
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-resilient
  template:
    metadata:
      labels:
        app: nginx-resilient
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-resilient-svc
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: nginx-resilient